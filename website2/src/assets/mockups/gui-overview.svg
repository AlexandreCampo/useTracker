    <rect x="918" y="86" width="86" height="26" fill="#18211e" stroke="#1f2a27"/><text x="930" y="103" fill="#ffdc28">Processing</text>
    <text x="1016" y="103" fill="#6b7873">Background</text>
    <text x="1104" y="103" fill="#6b7873">Calibration</text>
    <text x="1186" y="103" fill="#6b7873">Frame</text>
  </g>

  <text x="932" y="132" font-size="12" fill="#e9eeeb">Pipeline</text>
  <line x1="928" y1="140" x2="1254" y2="140" stroke="#1f2a27"/>

  <!-- pipeline list -->
  <rect x="928" y="148" width="326" height="182" fill="#0a0f0e" stroke="#1f2a27"/>
  <g font-size="11">
    <g>
      <rect x="936" y="156" width="11" height="11" rx="2" fill="#3ddc84"/><path d="M938.5 161.5l2 2 3.5-4" stroke="#0a0d0c" stroke-width="1.4" fill="none"/>
      <text x="955" y="166" fill="#c8d3ce">0: White Balance</text>
    </g>
    <g>
      <rect x="936" y="178" width="11" height="11" rx="2" fill="#3ddc84"/><path d="M938.5 183.5l2 2 3.5-4" stroke="#0a0d0c" stroke-width="1.4" fill="none"/>
      <text x="955" y="188" fill="#c8d3ce">1: Clahe</text>
    </g>
    <g>
      <rect x="932" y="196" width="318" height="18" fill="#1f2f2a"/>
      <rect x="936" y="200" width="11" height="11" rx="2" fill="#3ddc84"/><path d="M938.5 205.5l2 2 3.5-4" stroke="#0a0d0c" stroke-width="1.4" fill="none"/>
      <text x="955" y="210" fill="#ffdc28">2: Background Diff Knn</text>
      <text x="1240" y="210" fill="#ffdc28" text-anchor="end">◂</text>
    </g>
    <g>
      <rect x="936" y="222" width="11" height="11" rx="2" fill="#3ddc84"/><path d="M938.5 227.5l2 2 3.5-4" stroke="#0a0d0c" stroke-width="1.4" fill="none"/>
      <text x="955" y="232" fill="#c8d3ce">3: Erosion</text>
    </g>
    <g>
      <rect x="936" y="244" width="11" height="11" rx="2" fill="#1a2422" stroke="#2c3b37"/>
      <text x="955" y="254" fill="#55635e">4: Moving Average</text>
    </g>
    <g>
      <rect x="936" y="266" width="11" height="11" rx="2" fill="#3ddc84"/><path d="M938.5 271.5l2 2 3.5-4" stroke="#0a0d0c" stroke-width="1.4" fill="none"/>
      <text x="955" y="276" fill="#c8d3ce">5: Extract Blobs</text>
    </g>
    <g>
      <rect x="936" y="288" width="11" height="11" rx="2" fill="#3ddc84"/><path d="M938.5 293.5l2 2 3.5-4" stroke="#0a0d0c" stroke-width="1.4" fill="none"/>
      <text x="955" y="298" fill="#c8d3ce">6: Pattern Tracker</text>
    </g>
    <g>
      <rect x="936" y="310" width="11" height="11" rx="2" fill="#3ddc84"/><path d="M938.5 315.5l2 2 3.5-4" stroke="#0a0d0c" stroke-width="1.4" fill="none"/>
      <text x="955" y="320" fill="#c8d3ce">7: Record Video</text>
    </g>
  </g>

  <!-- splitter -->
  <line x1="1076" y1="337" x2="1106" y2="337" stroke="#2c3b37" stroke-width="3"/>

  <!-- pipeline buttons -->
  <g font-size="10.5" fill="#c8d3ce">
    <rect x="928" y="346" width="66" height="22" rx="2" fill="#1a2422" stroke="#2c3b37"/><text x="937" y="361">Settings…</text>
    <rect x="1000" y="346" width="58" height="22" rx="2" fill="#1a2422" stroke="#2c3b37"/><text x="1010" y="361">Remove</text>
    <rect x="1064" y="346" width="34" height="22" rx="2" fill="#1a2422" stroke="#2c3b37"/><text x="1074" y="361">Up</text>
    <rect x="1104" y="346" width="46" height="22" rx="2" fill="#1a2422" stroke="#2c3b37"/><text x="1113" y="361">Down</text>
  </g>

  <text x="932" y="392" font-size="12" fill="#e9eeeb">Available Plugins</text>
  <line x1="928" y1="400" x2="1254" y2="400" stroke="#1f2a27"/>

  <!-- available plugins tree -->
  <rect x="928" y="408" width="326" height="248" fill="#0a0f0e" stroke="#1f2a27"/>
  <g font-size="11">
    <text x="938" y="424" fill="#8b9a94">▾ Enhancement</text>
    <text x="952" y="440" fill="#c8d3ce">Clahe</text>
    <text x="952" y="456" fill="#c8d3ce">Curves</text>
    <text x="952" y="472" fill="#c8d3ce">White Balance</text>
    <text x="952" y="488" fill="#c8d3ce">Dehaze</text>
    <text x="938" y="510" fill="#8b9a94">▾ Background Subtraction</text>
    <text x="952" y="526" fill="#c8d3ce">Background Diff Knn</text>
    <text x="952" y="542" fill="#c8d3ce">Background Diff Gsoc</text>
    <text x="938" y="564" fill="#8b9a94">▸ Threshold &amp; Segmentation</text>
    <text x="938" y="586" fill="#8b9a94">▸ Morphology</text>
    <text x="938" y="608" fill="#8b9a94">▾ Markers &amp; Patterns</text>
    <text x="952" y="624" fill="#c8d3ce">Pattern Tracker</text>
    <text x="952" y="640" fill="#c8d3ce">Yolo Detector</text>
  </g>
  <g font-size="10.5" fill="#c8d3ce">
    <rect x="928" y="664" width="76" height="22" rx="2" fill="#1a2422" stroke="#2c3b37"/><text x="938" y="679">Add Plugin</text>
  </g>

  <!-- bottom-right: downscale + UI zoom -->
  <rect x="742" y="722" width="522" height="34" rx="2" fill="#131a18" stroke="#1f2a27" opacity="0.95"/>
  <g font-size="10.5" fill="#c8d3ce">
    <text x="754" y="743">Downscale</text>
    <line x1="822" y1="738" x2="962" y2="738" stroke="#1a2422" stroke-width="3"/>
    <g fill="#2fae6a"><circle cx="822" cy="738" r="4"/><circle cx="868" cy="738" r="4"/><circle cx="914" cy="738" r="4"/><circle cx="960" cy="738" r="4"/></g>
    <circle cx="868" cy="738" r="6" fill="#3ddc84"/>
    <g font-size="8" fill="#6b7873">
      <text x="815" y="752">1:1</text><text x="860" y="752">1/2</text><text x="906" y="752">1/4</text><text x="952" y="752">1/8</text>
    </g>
    <text x="978" y="743" fill="#6b7873">960x540</text>
    <line x1="1046" y1="728" x2="1046" y2="750" stroke="#2c3b37"/>
    <text x="1062" y="743">UI</text>
    <rect x="1082" y="728" width="24" height="20" rx="2" fill="#1a2422" stroke="#2c3b37"/><text x="1091" y="743">-</text>
    <text x="1116" y="743">100%</text>
    <rect x="1158" y="728" width="24" height="20" rx="2" fill="#1a2422" stroke="#2c3b37"/><text x="1167" y="743">+</text>
  </g>

  <!-- mockup watermark, so nobody mistakes this for a screenshot -->
  <text x="1264" y="790" font-size="9" fill="#3a4642" text-anchor="end" letter-spacing="0.14em">MOCKUP — REPLACE WITH SCREENSHOT</text>
</svg>
