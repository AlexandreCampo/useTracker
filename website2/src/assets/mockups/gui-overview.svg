<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800"
     font-family="IBM Plex Mono, ui-monospace, monospace" role="img"
     aria-label="Mockup of the useTracker main window: menu bar, playback toolbar, video area with tracking overlay, and the right-hand panel showing the Processing tab with the pipeline and the available-plugin list.">
  <title>useTracker main window (mockup)</title>

  <defs>
    <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123b42"/>
      <stop offset="0.55" stop-color="#0d2c33"/>
      <stop offset="1" stop-color="#081d22"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <clipPath id="videoClip"><rect x="16" y="86" width="890" height="608"/></clipPath>
  </defs>

  <!-- window chrome -->
  <rect width="1280" height="800" fill="#0a0d0c"/>
  <rect x="0" y="0" width="1280" height="28" fill="#151d1b"/>
  <circle cx="18" cy="14" r="4.5" fill="#3a4642"/><circle cx="34" cy="14" r="4.5" fill="#3a4642"/><circle cx="50" cy="14" r="4.5" fill="#3a4642"/>
  <text x="70" y="18" font-size="11" fill="#8b9a94">useTracker 2.0.0 — MVI_0078.MP4</text>

  <!-- menu bar -->
  <rect x="0" y="28" width="1280" height="24" fill="#111817"/>
  <text x="16" y="44" font-size="11.5" fill="#c8d3ce">File</text>
  <text x="58" y="44" font-size="11.5" fill="#c8d3ce">Help</text>

  <!-- toolbar -->
  <rect x="0" y="52" width="1280" height="34" fill="#0e1413"/>
  <g font-size="10.5" fill="#c8d3ce">
    <rect x="12" y="58" width="42" height="22" rx="2" fill="#2a1615" stroke="#5e2b28"/>
    <circle cx="24" cy="69" r="4" fill="#ff5f52"/><text x="32" y="73" fill="#ff8a80">REC</text>
    <rect x="60" y="58" width="42" height="22" rx="2" fill="#1a2422" stroke="#2c3b37"/><text x="70" y="73">Stop</text>
    <rect x="108" y="58" width="30" height="22" rx="2" fill="#1a2422" stroke="#2c3b37"/><text x="117" y="73">|&lt;</text>
    <rect x="142" y="58" width="24" height="22" rx="2" fill="#1a2422" stroke="#2c3b37"/><text x="151" y="73">&lt;</text>
    <rect x="170" y="58" width="30" height="22" rx="2" fill="#20302c" stroke="#3ddc84"/><text x="182" y="73" fill="#3ddc84">▶</text>
    <rect x="204" y="58" width="24" height="22" rx="2" fill="#1a2422" stroke="#2c3b37"/><text x="213" y="73">&gt;</text>
    <rect x="232" y="58" width="30" height="22" rx="2" fill="#1a2422" stroke="#2c3b37"/><text x="241" y="73">&gt;|</text>
  </g>

  <!-- seek bar with bookmarks and loop range -->
  <rect x="276" y="64" width="560" height="10" rx="2" fill="#1a2422" stroke="#2c3b37"/>
  <rect x="276" y="64" width="196" height="10" rx="2" fill="#26413a"/>
  <rect x="404" y="62" width="132" height="14" fill="#ffdc28" opacity="0.13"/>
  <g stroke="#ffdc28" stroke-width="1.5">
    <line x1="404" y1="60" x2="404" y2="78"/><line x1="536" y1="60" x2="536" y2="78"/>
  </g>
  <g fill="#4dd0e1"><rect x="330" y="60" width="2" height="18"/><rect x="612" y="60" width="2" height="18"/><rect x="702" y="60" width="2" height="18"/></g>
  <circle cx="472" cy="69" r="6" fill="#e9eeeb"/>
  <text x="276" y="57" font-size="8.5" fill="#6b7873">00:00</text>
  <text x="812" y="57" font-size="8.5" fill="#6b7873" text-anchor="end">02:24</text>

  <g font-size="10.5" fill="#c8d3ce">
    <rect x="846" y="58" width="38" height="22" rx="2" fill="#1a2422" stroke="#2c3b37"/><text x="853" y="73">Mark</text>
    <rect x="888" y="58" width="44" height="22" rx="2" fill="#1a2422" stroke="#2c3b37"/><text x="895" y="73">Loop+</text>
    <rect x="938" y="62" width="13" height="13" rx="2" fill="#1a2422" stroke="#2c3b37"/><text x="956" y="73">Loop</text>
    <rect x="990" y="62" width="13" height="13" rx="2" fill="#3ddc84"/><path d="M993 68.5l2.5 2.5 4-5" stroke="#0a0d0c" stroke-width="1.6" fill="none"/><text x="1008" y="73">HUD</text>
    <rect x="1042" y="62" width="13" height="13" rx="2" fill="#ffdc28"/><path d="M1045 68.5l2.5 2.5 4-5" stroke="#0a0d0c" stroke-width="1.6" fill="none"/><text x="1060" y="73">Ruler</text>
    <rect x="1098" y="58" width="50" height="22" rx="2" fill="#1a2422" stroke="#2c3b37"/><text x="1105" y="73">Line ▾</text>
    <rect x="1156" y="63" width="80" height="11" rx="5" fill="#1a2422" stroke="#2c3b37"/>
    <circle cx="1206" cy="68.5" r="6" fill="#8b9a94"/>
    <text x="1244" y="73" fill="#6b7873">0.6</text>
  </g>

  <!-- ================= video area ================= -->
  <g clip-path="url(#videoClip)">
    <rect x="16" y="86" width="890" height="608" fill="url(#tank)"/>
    <!-- scene texture: substrate and plants, so the mockup reads as footage -->
    <g opacity="0.5" fill="#0b262b">
      <ellipse cx="180" cy="676" rx="240" ry="46"/><ellipse cx="640" cy="686" rx="300" ry="40"/>
    </g>
    <g stroke="#14454b" stroke-width="3" fill="none" opacity="0.6">
      <path d="M120 690c-8-60 14-96 4-140"/><path d="M148 690c6-52-16-86-4-124"/>
      <path d="M786 690c10-70-16-104-2-150"/><path d="M818 690c-8-56 18-88 6-128"/>
    </g>
    <g opacity="0.25" fill="#5fd3e0">
      <circle cx="300" cy="220" r="2"/><circle cx="520" cy="160" r="1.5"/><circle cx="700" cy="300" r="2.5"/>
      <circle cx="220" cy="420" r="1.5"/><circle cx="640" cy="500" r="2"/><circle cx="420" cy="600" r="1.5"/>
    </g>
    <rect x="16" y="86" width="890" height="608" fill="url(#vig)"/>

