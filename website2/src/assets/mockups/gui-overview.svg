    <g fill="#cfe6d9" opacity="0.92">
      <path d="M300 300c22-14 52-14 70 0-18 14-48 14-70 0zm-4 0l-16-11v22z"/>
      <path d="M560 430c20-13 48-13 64 0-16 13-44 13-64 0zm-4 0l-15-10v20z"/>
      <path d="M700 210c18-11 42-11 56 0-14 11-38 11-56 0zm-3 0l-13-9v18z"/>
      <path d="M420 560c17-11 40-11 54 0-14 11-37 11-54 0zm-3 0l-13-9v18z"/>
    </g>

    <!-- HUD: confirmed tracks (green) with trails and ids -->
    <g fill="none" stroke="#3ddc84" stroke-width="1.6">
      <rect x="288" y="282" width="98" height="36"/>
      <rect x="548" y="414" width="90" height="32"/>
      <rect x="686" y="196" width="82" height="28"/>
    </g>
    <g stroke="#3ddc84" stroke-width="1.4" fill="none" opacity="0.75">
      <path d="M168 386c40-34 78-70 168-92"/>
      <path d="M452 512c30-32 62-58 140-76"/>
      <path d="M596 128c22 26 56 50 108 68"/>
    </g>
    <g fill="#3ddc84" font-size="11">
      <text x="288" y="276">id 0  s 0.91</text><text x="548" y="408">id 1  s 0.88</text><text x="686" y="190">id 2  s 0.84</text>
    </g>

    <!-- HUD: unconfirmed candidate (orange) -->
    <rect x="408" y="544" width="82" height="32" fill="none" stroke="#ff8a3d" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="408" y="538" font-size="11" fill="#ff8a3d">candidate</text>

    <!-- ruler measurement overlay -->
    <g stroke="#ffdc28" stroke-width="1.8">
      <line x1="340" y1="640" x2="600" y2="600"/>
      <circle cx="340" cy="640" r="3.5" fill="#ffdc28"/><circle cx="600" cy="600" r="3.5" fill="#ffdc28"/>
    </g>
    <rect x="446" y="606" width="184" height="17" fill="#000" opacity="0.7"/>
    <text x="452" y="618" font-size="10.5" fill="#ffdc28">263 px  dx 260  dy 40</text>

    <!-- zone polygon -->
    <path d="M60 140h300v180H60z" fill="#4dd0e1" opacity="0.07"/>
    <path d="M60 140h300v180H60z" fill="none" stroke="#4dd0e1" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="66" y="134" font-size="10.5" fill="#4dd0e1">zone 1</text>
  </g>
  <rect x="16" y="86" width="890" height="608" fill="none" stroke="#1f2a27"/>

  <!-- status line -->
  <text x="18" y="710" font-size="11" fill="#8b9a94">Time: 00:41  Frame: 1247 / 3600  FPS: 25.0  Speed: 1x</text>

  <!-- ================= right panel ================= -->
  <rect x="918" y="86" width="346" height="608" fill="#0e1413" stroke="#1f2a27"/>

